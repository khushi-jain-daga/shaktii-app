<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070812" />
  <meta name="description" content="PWN SHAKTI secure file, blockchain verification and threat response application." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="PWN SHAKTI" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest?v=17" />
  <link rel="icon" href="/assets/icon-192.svg?v=17" />
  <link rel="apple-touch-icon" href="/assets/icon-192.svg?v=17" />
  <link rel="stylesheet" href="/style.css?v=17" />
  <link rel="stylesheet" href="/mobile-fix.css?v=17" />
  <title>PWN SHAKTI — Secure Data Command</title>
</head>
<body>
  <div id="app" class="app-root"></div>

  <div class="alarm-layer" id="alarmLayer" aria-hidden="true">
    <div class="alarm-card" role="dialog" aria-modal="true" aria-label="Critical security alarm">
      <div class="alarm-pulse"><span></span><span></span><span></span></div>
      <p class="overline danger-text">Critical security alarm</p>
      <h2>Unauthorized access chain detected</h2>
      <p>SHAKTII detected a suspicious admin session. Acknowledge within SLA or escalation policy will activate.</p>
      <div class="alarm-actions">
        <button class="btn ghost" data-close-alarm>Dismiss</button>
        <button class="btn danger" data-ack-alarm>Acknowledge alert</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/data.js?v=17"></script>
  <script src="/api.js?v=17"></script>
  <script src="/app.js?v=17"></script>
  <script src="/install-fix.js?v=17"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js?v=17').catch(() => undefined));
    }
  </script>
</body>
</html>
